name: OpenAI issue to PR

on:
  repository_dispatch:
    types: [orchestrator_issue]
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to implement
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  openai_issue_to_pr:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.pull_request == null)
    outputs:
      final_message: ${{ steps.run_codex.outputs.final-message }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve issue context
        id: issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const isObject = (value) =>
              value !== null && typeof value === 'object' && !Array.isArray(value);

            const payload = isObject(context.payload) ? context.payload : {};
            const clientPayload = isObject(payload.client_payload) ? payload.client_payload : {};
            const payloadIssue = isObject(payload.issue) ? payload.issue : {};
            const clientIssue = isObject(clientPayload.issue) ? clientPayload.issue : {};
            const rawIssueNumber =
              payload.inputs?.issue_number ??
              payloadIssue.number ??
              clientPayload.issue_number ??
              clientIssue.number ??
              (!isObject(clientPayload.issue) ? clientPayload.issue : undefined) ??
              clientPayload.orchestrator_issue_number;

            const issueNumber = Number(rawIssueNumber);
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed(
                `Could not resolve a valid issue number. ` +
                `Event: ${context.eventName}. ` +
                `For manual runs, pass the issue_number workflow input. ` +
                `For repository_dispatch, send client_payload.issue_number or client_payload.issue.number.`
              );
              return;
            }

            if (context.eventName === 'repository_dispatch') {
              const issueRepository =
                clientPayload.issue_repository ||
                clientPayload.source_repository ||
                clientPayload.repository ||
                clientPayload.orchestrator_repo ||
                `${context.repo.owner}/${context.repo.repo}`;

              core.setOutput('number', String(issueNumber));
              core.setOutput('title', clientIssue.title || clientPayload.orchestrator_issue_title || '');
              core.setOutput('body', clientIssue.body || clientPayload.orchestrator_issue_body || '');
              core.setOutput('url', clientIssue.url || clientPayload.orchestrator_issue_url || '');
              core.setOutput('author', clientIssue.author || clientIssue.user?.login || clientPayload.orchestrator_issue_author || 'unknown');
              core.setOutput('repository', issueRepository);
              core.setOutput('target_role', clientPayload.target_role || 'parser-or-api-service');
              core.setOutput('is_local_issue', String(issueRepository === `${context.repo.owner}/${context.repo.repo}`));
              return;
            }

            const issueRepository =
              clientPayload.issue_repository ||
              clientPayload.source_repository ||
              clientPayload.repository ||
              clientPayload.orchestrator_repo ||
              `${context.repo.owner}/${context.repo.repo}`;
            const [issueOwner, issueRepo] = issueRepository.split('/');

            if (!issueOwner || !issueRepo) {
              core.setFailed(`Invalid issue repository: ${issueRepository}`);
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: issueOwner,
              repo: issueRepo,
              issue_number: issueNumber,
            });

            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');
            core.setOutput('url', issue.html_url);
            core.setOutput('author', issue.user?.login || 'unknown');
            core.setOutput('repository', `${issueOwner}/${issueRepo}`);
            core.setOutput('target_role', clientPayload.target_role || 'local');
            core.setOutput('is_local_issue', String(`${issueOwner}/${issueRepo}` === `${context.repo.owner}/${context.repo.repo}`));

      - name: Generate Codex prompt
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_REPOSITORY: ${{ steps.issue.outputs.repository }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
          ISSUE_TARGET_ROLE: ${{ steps.issue.outputs.target_role }}
          ISSUE_IS_LOCAL: ${{ steps.issue.outputs.is_local_issue }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const prompt = `You are Codex running in GitHub Actions for the resume-parser-api repository.
            Implement the GitHub issue below as a complete, production-quality code change.
            Do not only describe the change. Modify the repository files directly.

            Follow all repository guidance in AGENTS.md.

            Workflow:
            1. Inspect relevant source files before editing.
            2. Implement the smallest safe change.
            3. Preserve the FastAPI route contracts and strict Pydantic response models.
            4. Treat LLM output as untrusted; validate and normalize before returning or storing.
            5. Keep MongoDB serialization JSON-safe and preserve stable ID behavior for edited resumes.
            6. Add or update focused unittest tests when behavior changes.
            7. Run python -m unittest discover -s tests when feasible.
            8. Leave a concise final summary with verification results.

            GitHub issue:
            Repository: ${process.env.ISSUE_REPOSITORY}
            Issue: #${process.env.ISSUE_NUMBER}
            Title: ${process.env.ISSUE_TITLE}
            Author: @${process.env.ISSUE_AUTHOR}
            URL: ${process.env.ISSUE_URL}
            Target role: ${process.env.ISSUE_TARGET_ROLE}
            Issue is local to this repo: ${process.env.ISSUE_IS_LOCAL}

            If this issue was dispatched from an orchestrator repo and this repository does not need changes,
            make no file edits and explain why in the final message.

            Body:
            ${process.env.ISSUE_BODY || '(No issue body provided.)'}
            `;

            const promptPath = path.join('.github', 'openai', 'generated', 'issue-prompt.md');
            fs.mkdirSync(path.dirname(promptPath), { recursive: true });
            fs.writeFileSync(promptPath, prompt.replace(/^ {12}/gm, ''), 'utf8');

      - name: Verify OpenAI API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::Missing OPENAI_API_KEY repository secret."
            exit 1
          fi

      - name: Prepare workspace for Codex
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/codex-home"
          chmod -R a+rwX "$RUNNER_TEMP/codex-home"

      - name: Run Codex
        id: run_codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/openai/generated/issue-prompt.md
          output-file: .github/openai/generated/codex-output.md
          sandbox: workspace-write
          codex-home: ${{ runner.temp }}/codex-home

      - name: Upload Codex diagnostics
        if: always() && hashFiles('.github/openai/generated/*.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codex-diagnostics-issue-${{ steps.issue.outputs.number }}
          path: .github/openai/generated/*.md
          if-no-files-found: ignore

      - name: Remove generated Codex files from diff
        if: always()
        run: |
          rm -f .github/openai/generated/issue-prompt.md
          rm -f .github/openai/generated/codex-output.md

      - name: Detect changes
        if: always()
        id: changes
        run: |
          git status --short

          if git status --porcelain | grep .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create implementation pull request
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_REPOSITORY: ${{ steps.issue.outputs.repository }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
          ISSUE_IS_LOCAL: ${{ steps.issue.outputs.is_local_issue }}
        run: |
          set -euo pipefail

          branch="openai/issue-${ISSUE_NUMBER}"
          git checkout -B "$branch"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Implement issue #${ISSUE_NUMBER} with Codex"
          git push --force origin "$branch"

          pr_body="$(mktemp)"
          {
            if [ "${ISSUE_IS_LOCAL}" = "true" ]; then
              echo "Closes #${ISSUE_NUMBER}"
            else
              echo "Part of orchestrator issue: ${ISSUE_URL}"
            fi
            echo
            echo "Codex step outcome: ${CODEX_OUTCOME}"
            echo
            echo "Codex summary:"
            echo
            if [ -n "${CODEX_FINAL_MESSAGE}" ]; then
              echo "${CODEX_FINAL_MESSAGE}"
            else
              echo "Codex completed with file changes, but did not return a final message."
            fi
          } > "$pr_body"

          if gh pr create \
            --title "Implement issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body-file "$pr_body" \
            --base "$DEFAULT_BRANCH" \
            --head "${{ github.repository_owner }}:$branch"; then
            echo "Pull request created."
          else
            compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${DEFAULT_BRANCH}...${branch}"
            {
              echo "Codex pushed an implementation branch, but GitHub Actions is not permitted to create pull requests in this repository."
              echo
              echo "Branch: \`${branch}\`"
              echo "Open PR manually: ${compare_url}"
              echo
              echo "To allow automatic PR creation, enable this repository setting:"
              echo "Settings -> Actions -> General -> Workflow permissions -> Allow GitHub Actions to create and approve pull requests."
            } > "$pr_body"

            if [ "${ISSUE_REPOSITORY}" = "${GITHUB_REPOSITORY}" ]; then
              gh issue comment "${ISSUE_NUMBER}" --repo "${ISSUE_REPOSITORY}" --body-file "$pr_body"
            else
              cat "$pr_body"
            fi
          fi

      - name: Comment when no changes were made
        if: steps.changes.outputs.has_changes == 'false' && steps.issue.outputs.is_local_issue == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_REPOSITORY: ${{ steps.issue.outputs.repository }}
          CODEX_FINAL_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
          CODEX_OUTCOME: ${{ steps.run_codex.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            const body = [
              'Codex ran for this issue but did not produce any file changes.',
              '',
              `Codex step outcome: ${process.env.CODEX_OUTCOME || 'unknown'}`,
              '',
              process.env.CODEX_FINAL_MESSAGE || 'No final Codex message was returned.',
            ].join('\n');

            const [owner, repo] = process.env.ISSUE_REPOSITORY.split('/');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body,
            });

      - name: Comment when workflow failed
        if: failure() && steps.issue.outputs.is_local_issue == 'true'
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_REPOSITORY: ${{ steps.issue.outputs.repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            if (!issueNumber) {
              core.info('Issue number was not resolved; skipping failure comment.');
              return;
            }

            const issueRepository = process.env.ISSUE_REPOSITORY || `${context.repo.owner}/${context.repo.repo}`;
            const [owner, repo] = issueRepository.split('/');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `Codex issue-to-PR workflow failed before it could create a pull request.\n\nRun logs: ${runUrl}`,
            });
